name: PREVITA - Alertas Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render (health)
        run: |
          set -e
          echo "Waking Render..."
          curl -sS -L --max-time 90 --retry 5 --retry-all-errors \
            "https://previta-api.onrender.com/health"
          echo ""

      - name: Chamar API PREVITA (Telegram) - 1x
        env:
          ALERT_API_KEY: ${{ secrets.ALERT_API_KEY }}
        run: |
          set -e
          URL="https://previta-api.onrender.com/v1/notify/telegram/run?minutes_back=1440&max_send=10"
          echo "POST: $URL"
          RESP=$(curl -sS -L --max-time 90 --retry 5 --retry-all-errors \
            -X POST "$URL" \
            -H "X-API-KEY: $ALERT_API_KEY" \
            -H "Content-Type: application/json")
          echo "Resposta API:"
          echo "$RESP"
concurrency: 
  group: previta-telegram-alerts
  cancel-in-progress: false
