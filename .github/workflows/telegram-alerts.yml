name: PREVITA – Alertas Telegram (2 em 2 minutos)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Chamar API PREVITA (Telegram)
        run: |
          curl -X POST "https://previta-api.onrender.com/v1/notify/telegram/run?minutes_back=1440&limit=10"
